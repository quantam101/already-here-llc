module:
  id: content-engine
  name: Content Engine
  version: 2.0.0
  state: production_ready
  cost_mode: zero_spend
  enabled: true
  owner: stephen-franklin
  purpose: AI-assisted content repurposing, proof generation, and client-facing copy validation.
  allowed_connectors:
    - local_files
    - ollama_local
    - playwright_local
  agents:
    - agent_ai_operations_advisor
    - agent_proof
  forbidden_actions:
    - paid_api_call
    - public_post
    - email_send
    - production_deploy
  requires_approval_for:
    - external_write
    - paid_call
    - production_change
  healthcheck:
    path: /api/enterprise/orchestrator?operation=advise_intake&source=content-engine
    port: 3000
    method: GET
    expected_status: 200
  env_required: []
  env_optional: []
