module:
  id: lifecycle
  name: Lifecycle Management
  version: 2.0.0
  state: production_ready
  cost_mode: zero_spend
  enabled: true
  owner: stephen-franklin
  purpose: Lifelong Catch and Correct, proof loops, quality governance, and correction logging.
  allowed_connectors:
    - local_files
    - github_read
  agents:
    - agent_lifelong_catch_correct
    - agent_proof
    - agent_compliance
  forbidden_actions:
    - any_cost
    - public_post
    - paid_api_call
  requires_approval_for:
    - policy_update
    - external_write
  healthcheck:
    path: /api/enterprise/orchestrator?operation=healthcheck_backend&source=lifecycle
    port: 3000
    method: GET
    expected_status: 200
  env_required: []
  env_optional: []
