module:
  id: tradegate
  name: Trade Gate
  version: 2.0.0
  state: production_ready
  cost_mode: zero_spend
  enabled: true
  owner: stephen-franklin
  purpose: Market data and paper/shadow trading runtime integration for proof-of-work only. No live-money execution.
  allowed_connectors:
    - local_files
    - github_read
  agents:
    - agent_field_network
    - agent_revenue
  forbidden_actions:
    - live_trade
    - place_order
    - move_money
    - paid_api_call
    - public_post
  requires_approval_for:
    - external_write
    - paid_call
    - live_trade
  healthcheck:
    path: /api/enterprise/orchestrator?operation=healthcheck_backend&source=tradegate
    port: 3000
    method: GET
    expected_status: 200
  env_required: []
  env_optional: []
