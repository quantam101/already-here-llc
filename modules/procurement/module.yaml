module:
  id: procurement
  name: Procurement and Grant Intelligence
  version: 2.0.0
  state: production_ready
  cost_mode: zero_spend
  enabled: true
  owner: stephen-franklin
  purpose: Procurement, grant, and teaming opportunity intelligence with dedupe, suppression, and scoring.
  allowed_connectors:
    - local_files
    - github_read
    - playwright_local
    - public_web_search
    - sourcewell_naspo_read
    - sam_gov_read
  agents:
    - agent_opportunity_intelligence
    - agent_procurement_grant
    - agent_scoring
    - agent_routing
  forbidden_actions:
    - paid_api_call
    - email_send
    - public_post
    - submit_application
    - create_external_account
  requires_approval_for:
    - external_write
    - paid_call
    - external_share
  healthcheck:
    path: /api/enterprise/orchestrator?operation=healthcheck_backend&source=procurement
    port: 3000
    method: GET
    expected_status: 200
  env_required: []
  env_optional: []
