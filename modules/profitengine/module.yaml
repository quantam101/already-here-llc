module:
  id: profitengine
  name: ProfitEngine
  version: 2.0.0
  state: production_ready
  cost_mode: api_spend
  enabled: true
  owner: stephen-franklin
  purpose: Automated content generation, product publishing, and revenue intelligence pipeline.
  app_dir: profitengine/
  entry: profitengine/index.js
  ecosystem_config: ops/profitengine/ecosystem.config.cjs
  allowed_connectors:
    - local_files
    - github_read
  agents:
    - agent_revenue_os
    - agent_revenue
    - agent_outreach
  forbidden_actions:
    - live_trade
    - place_order
    - move_money
    - public_post
    - paid_api_call
  requires_approval_for:
    - external_write
    - paid_call
    - production_change
  healthcheck:
    path: /api/health
    port: 3000
    method: GET
    expected_status: 200
  env_required:
    - GROQ_API_KEY
  env_optional:
    - GITHUB_TOKEN
    - GITHUB_REPO_OWNER
    - GITHUB_REPO_NAME
    - DEVTO_API_KEY
    - HASHNODE_TOKEN
    - MEDIUM_TOKEN
