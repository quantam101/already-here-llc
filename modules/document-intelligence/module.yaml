module:
  id: document-intelligence
  name: Document Intelligence
  version: 2.0.0
  state: production_ready
  cost_mode: zero_spend
  enabled: true
  owner: stephen-franklin
  purpose: Local document processing into summaries, action items, SOPs, and packet drafts.
  allowed_connectors:
    - local_files
    - document_intelligence
  agents:
    - agent_grant_procurement_packet
    - agent_proof
  forbidden_actions:
    - paid_api_call
    - submit_application
    - email_send
    - public_post
  requires_approval_for:
    - external_share
    - paid_call
    - production_change
  healthcheck:
    path: /api/enterprise/orchestrator?operation=prepare_packet&source=document-intelligence
    port: 3000
    method: GET
    expected_status: 200
  env_required: []
  env_optional: []
