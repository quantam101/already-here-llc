module:
  id: security
  name: Security and Compliance
  version: 2.0.0
  state: production_ready
  cost_mode: zero_spend
  enabled: true
  owner: stephen-franklin
  purpose: Security model, no-spend enforcement, compliance gates, audit, and risk suppression.
  allowed_connectors:
    - local_files
    - github_read
  agents:
    - agent_compliance
    - agent_backend_command
  forbidden_actions:
    - any_cost
    - paid_api_call
    - public_post
    - production_deploy
  requires_approval_for:
    - policy_update
    - any_external_action
    - production_change
  healthcheck:
    path: /api/enterprise/orchestrator?operation=healthcheck_backend&source=security
    port: 3000
    method: GET
    expected_status: 200
  env_required: []
  env_optional: []
