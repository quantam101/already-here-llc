connectors:
  local_files:
    state: free_core
    enabled: true
    permissions: [read_workspace, write_drafts]
  github_read:
    state: free_external
    enabled: false
    permissions: [read_repo]
  github_write:
    state: forbidden_without_approval
    enabled: false
    permissions: [create_branch, open_pr]
  n8n_local:
    state: free_core
    enabled: true
    permissions: [run_local_workflow]
  playwright_local:
    state: free_core
    enabled: true
    permissions: [browser_research]
  ollama_local:
    state: free_core
    enabled: false
    permissions: [local_inference]
  gmail_read:
    state: owner_data
    enabled: false
    permissions: [read_owner_email, read_owner_thread]
  public_web_search:
    state: free_external
    enabled: true
    permissions: [search_public_web]
  government_api_read:
    state: free_external
    enabled: false
    permissions: [query_public_api]
  sourcewell_naspo_read:
    state: free_external
    enabled: true
    permissions: [read_public_procurement_page]
  sam_gov_read:
    state: free_external
    enabled: false
    permissions: [query_public_api]
  openai_api:
    state: optional_paid_disabled
    enabled: false
    permissions: []
  anthropic_api:
    state: optional_paid_disabled
    enabled: false
    permissions: []
  perplexity_api:
    state: optional_paid_disabled
    enabled: false
    permissions: []
  stripe:
    state: forbidden_without_approval
    enabled: false
    permissions: []
