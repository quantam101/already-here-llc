apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-ai-haul
  namespace: gmaos
  labels:
    app.kubernetes.io/name: photo-ai-haul
    app.kubernetes.io/part-of: gmaos
    app.kubernetes.io/component: photo-ai
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: photo-ai-haul
  template:
    metadata:
      labels:
        app.kubernetes.io/name: photo-ai-haul
        app.kubernetes.io/part-of: gmaos
        app.kubernetes.io/component: photo-ai
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: photo-ai-haul
          image: ghcr.io/quantam101/already-here-llc-photo-ai-haul:latest
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: gmaos-config
            - secretRef:
                name: gmaos-secrets
                optional: true
          env:
            - name: HAUL_SCANNER_HOST
              value: "0.0.0.0"
            - name: HAUL_SCANNER_PORT
              value: "8000"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 18
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
