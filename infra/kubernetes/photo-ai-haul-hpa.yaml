apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: photo-ai-haul
  namespace: gmaos
  labels:
    app.kubernetes.io/name: photo-ai-haul
    app.kubernetes.io/part-of: gmaos
    app.kubernetes.io/component: photo-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: photo-ai-haul
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
