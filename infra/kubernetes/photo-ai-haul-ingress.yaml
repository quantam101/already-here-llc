apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: photo-ai-haul
  namespace: gmaos
  labels:
    app.kubernetes.io/name: photo-ai-haul
    app.kubernetes.io/part-of: gmaos
    app.kubernetes.io/component: photo-ai
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/rate-limit-connections: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - photo-ai.alreadyherellc.com
      secretName: photo-ai-haul-tls
  rules:
    - host: photo-ai.alreadyherellc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: photo-ai-haul
                port:
                  number: 80
