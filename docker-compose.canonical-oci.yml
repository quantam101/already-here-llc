services:
  canonical:
    build:
      context: .
      dockerfile: Dockerfile.canonical
    restart: unless-stopped
    expose:
      - "8443"
    environment:
      CANONICAL_API_KEY: ${CANONICAL_API_KEY:?CANONICAL_API_KEY is required}
      CANONICAL_SQLITE_PATH: /data/oci-canonical-graph.db
      CANONICAL_BACKUP_DIR: /backups
      CANONICAL_HOST: 0.0.0.0
      CANONICAL_PORT: 8443
    volumes:
      - canonical_data:/data
      - canonical_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; req=urllib.request.Request('http://127.0.0.1:8443/health', headers={'X-API-Key':'${CANONICAL_API_KEY:-}'}); urllib.request.urlopen(req)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OCI_CANONICAL_DOMAIN: ${OCI_CANONICAL_DOMAIN:?OCI_CANONICAL_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:-admin@alreadyherellc.com}
    volumes:
      - ./runtime/Caddyfile.canonical:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      canonical:
        condition: service_healthy

volumes:
  canonical_data:
  canonical_backups:
  caddy_data:
  caddy_config:
