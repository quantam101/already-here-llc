name: Ecosystem Production Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/ecosystem-production-gate.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ecosystem production gate
        run: npm run qa:ecosystem
        env:
          PROFITENGINE_HEALTH_URL: ${{ secrets.PROFITENGINE_HEALTH_URL }}
          TOKENFORGE_HEALTH_URL: ${{ secrets.TOKENFORGE_HEALTH_URL }}
          FIELD_NETWORK_DASHBOARD_URL: ${{ secrets.FIELD_NETWORK_DASHBOARD_URL }}
