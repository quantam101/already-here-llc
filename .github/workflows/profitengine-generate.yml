name: ProfitEngine Content Generation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 7 * * *'   # 7AM UTC daily
    - cron: '0 19 * * *'  # 7PM UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: profitengine/package-lock.json

      - name: Install dependencies
        run: npm install --omit=dev
        working-directory: profitengine

      - name: Validate content quality gate
        run: npm test
        working-directory: profitengine

      - name: Generate content
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CONTENT_OUTPUT_DIR: ${{ github.workspace }}/content/blog
          POSTS_PER_RUN: '1'
          CONTENT_MAX_ATTEMPTS: '3'
          CONTENT_MIN_WORDS: '850'
          CONTENT_MAX_WORDS: '1600'
          CONTENT_SIMILARITY_THRESHOLD: '0.42'
          PUBLISH_REQUIRED_PLATFORMS: 'filesystem'
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          node -e "
          const { runContentPipeline } = require('./pipeline.js');
          runContentPipeline().then(results => {
            const ok = results.filter(r => r.success).length;
            const failed = results.filter(r => !r.success);
            console.log('[done]', ok, '/', results.length, 'succeeded');
            if (failed.length) console.error('[failed]', JSON.stringify(failed, null, 2));
            process.exit(ok === results.length && results.length > 0 ? 0 : 1);
          }).catch(e => { console.error(e); process.exit(1); });
          "
        working-directory: profitengine

      - name: Enforce prepublication catalog gate
        run: npm run content:validate

      - name: Open an approval-required content pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.email "profitengine@alreadyherellc.com"
          git config user.name "ProfitEngine"
          git add content/blog/
          if git diff --staged --quiet; then
            echo "No new content"
            exit 0
          fi
          branch="profitengine/content-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="content: ProfitEngine draft $(date -u +%Y-%m-%d-%H%M)"
          git switch -c "$branch"
          git commit -m "$title"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "$title" \
            --body "Automated content draft. Merge only after required CI passes and an owner approves the publication."

