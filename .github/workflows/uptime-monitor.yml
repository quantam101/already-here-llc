name: Uptime Monitor
on:
  schedule:
    - cron: '0 8 * * *'    # once daily — low-cost GitHub backup; UptimeRobot (free) is the 5-min primary
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe endpoints and alert on failure
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: dispatch@alreadyherellc.com
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time, urllib.request, datetime
          # Custom domains cut over to Render/Vercel on 2026-07-12
          # (api -> CNAME profitengine-api-6cwb.onrender.com, app -> CNAME
          # cname.vercel-dns.com); onrender/vercel URLs probed too so a future
          # DNS problem is distinguishable from a service outage.
          ENDPOINTS = [
              "https://api.alreadyherellc.com/api/health",
              "https://app.alreadyherellc.com",
              "https://www.alreadyherellc.com/api/health",
              "https://profitengine-api-6cwb.onrender.com/api/health",
              "https://profitengine-runtime.onrender.com/health",
              "https://daily-command-os.vercel.app/api/health",
          ]
          # Browser UA: the Next.js edge middleware 403s curl user-agents.
          # -m 30 per probe; three attempts + 30s pauses still span a ~60s cold start
          # while keeping the worst case under the job timeout so the alert can send.
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36 uptime-monitor"
          # Render returns 503 while a sleeping free instance boots, so a 5xx is
          # retried after a pause before it counts as DOWN (3 probes, ~2.5 min).
          def probe(u):
              return subprocess.run(["curl","-s","-o","/dev/null","-m","30","-L","-A",UA,"-w","%{http_code}",u],
                                    capture_output=True, text=True).stdout.strip() or "000"
          down = []
          for u in ENDPOINTS:
              code = probe(u)
              for attempt in range(2):
                  if code[:1] in ("2","3"):
                      break
                  print(f"{code}  {u} (attempt {attempt + 1}, retrying in 30s)")
                  time.sleep(30)
                  code = probe(u)
              print(f"{code}  {u}")
              if not code[:1] in ("2","3"):
                  down.append(f"{code}  {u}")
          if not down:
              print("all endpoints healthy")
              raise SystemExit(0)
          print("::warning::endpoints down: " + "; ".join(down))
          key = os.environ.get("RESEND_API_KEY", "").strip()
          if key:
              body = ("Uptime monitor detected DOWN endpoints (run %s):\n\n%s\n\nTime: %s UTC"
                      % (os.environ.get("RUN_ID",""), "\n".join(down),
                         datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")))
              payload = json.dumps({
                  "from": "Uptime Monitor <dispatch@alreadyherellc.com>",
                  "to": [os.environ["ALERT_TO"]],
                  "subject": "ALERT: Already Here endpoint DOWN",
                  "text": body,
              }).encode()
              req = urllib.request.Request("https://api.resend.com/emails", data=payload, method="POST",
                  headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json",
                           "User-Agent": "already-here-llc-uptime/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print("alert email sent, id=" + json.loads(r.read()).get("id",""))
              except Exception as e:
                  print("alert email FAILED:", e)
          raise SystemExit(1)
          PY
