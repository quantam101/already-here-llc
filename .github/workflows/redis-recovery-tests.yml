name: Redis recovery safety tests

on:
  pull_request:
    paths:
      - 'ops/backup/**'
      - '.github/workflows/upstash-private-backup.yml'
      - '.github/workflows/redis-recovery-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ops/backup/**'
      - '.github/workflows/upstash-private-backup.yml'
      - '.github/workflows/redis-recovery-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r ops/backup/requirements.txt
      - name: Verify encrypted recovery tests
        run: python -m unittest discover -s ops/backup -p 'test_*.py' -v
      - name: Verify uploader syntax
        run: node --check ops/backup/upload.mjs
