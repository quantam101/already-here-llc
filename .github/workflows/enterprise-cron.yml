name: Enterprise ASIOS Cron

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger daily enterprise scan
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cron_resp.txt -w '%{http_code}' \
            -H "x-cron-secret: ${{ secrets.AHFOS_CRON_SECRET }}" \
            "https://www.alreadyherellc.com/api/enterprise/cron")
          echo "HTTP $code"
          cat /tmp/cron_resp.txt || true
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::enterprise cron returned HTTP $code (auth or endpoint failure)"
            exit 1
          fi
