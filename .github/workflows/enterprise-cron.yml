name: Enterprise ASIOS Cron

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger daily enterprise scan
        run: |
          curl -fsS -H "x-cron-secret: ${{ secrets.AHFOS_CRON_SECRET }}" \
            "https://www.alreadyherellc.com/api/enterprise/cron" || true
