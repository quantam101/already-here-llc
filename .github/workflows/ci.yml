name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'content/**'
      - 'exports/**'
      - 'data/**'
      - 'hermes/receipts/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'content/blog/**'
      - 'hermes/receipts/**'

permissions:
  contents: read

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  ZAPIER_WEBHOOK_URL: ${{ secrets.ZAPIER_WEBHOOK_URL }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Quality gate
        shell: bash
        run: |
          set +e
          npm run qa:gate 2>&1 | tee quality-gate-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::quality gate failure summary"
            tail -n 220 quality-gate-output.log
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-gate-output
          path: |
            quality-gate-output.log
            hermes/receipts/*-quality-gate.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Notify Slack/Zapier
        if: always() && !cancelled()
        env:
          ALERT_TITLE: Already Here LLC CI ${{ job.status }}
          ALERT_STATUS: ${{ job.status }}
          ALERT_PRIORITY: ${{ job.status == 'failure' && 'high' || 'normal' }}
          ALERT_GRADE: ${{ job.status == 'failure' && 'A-action-required' || 'B-monitor' }}
          ALERT_SUMMARY: CI completed with status `${{ job.status }}` for `${{ github.repository }}` on `${{ github.ref_name }}`.
          ALERT_ACTION: ${{ job.status == 'failure' && 'Review failed GitHub Actions logs, fix blockers, and rerun validation before treating automation as live.' || 'No blocking action required unless this run was expected to release revenue automation.' }}
          ALERT_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_SOURCE: github-actions-ci
        run: node scripts/notify-dispatch-alert.mjs
