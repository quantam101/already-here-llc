name: Upstash encrypted recovery backup (preflight only)

# Production data access and upload are intentionally disabled until
# a protected signer and isolated end-to-end restore are verified.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check -r ops/backup/requirements.txt
      - name: Verify backup safety without production secrets
        run: |
          python -m unittest discover -s ops/backup -p 'test_*.py' -v
          node --check ops/backup/upload.mjs
      - name: Activation gate
        run: echo "::notice::Preflight only; no production backup is performed."
